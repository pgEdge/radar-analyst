name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every version is reported, rather than the run stopping at
      # the first that breaks: knowing it fails on 16 and passes on
      # 17 and 18 is the useful answer.
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    env:
      RADAR_ANALYST_PG_MAJOR: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The pgEdge images are not public, and both the test
      # containers and the compose stack pull them.
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create venv + install dev deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip build
          .venv/bin/pip install -e '.[dev]'

      - name: Run full local CI
        run: ./run-ci-local.sh
