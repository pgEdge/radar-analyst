name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Local CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Create venv + install dev deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip build
          .venv/bin/pip install -e '.[dev]'

      - name: Run full local CI
        run: ./run-ci-local.sh
