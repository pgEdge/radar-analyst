name: Release image

# Publishes the container image an end user runs. Manual by default,
# plus every version tag, so nothing is pushed to the registry as a
# side effect of merging.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: the commit SHA)"
        required: false
        type: string
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build and push
    # Builds each platform on a native runner of its own and then
    # joins them into one multi-platform image.
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      # Signs the build's attestations with the GitHub OIDC token.
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
        type=sha,enable=${{ inputs.tag == '' }}
      set-meta-labels: true
      # Without these, the title, description and licence come from
      # the repository's settings on GitHub.
      meta-labels: |
        org.opencontainers.image.title=pgEdge Radar Analyst
        org.opencontainers.image.description=Assesses radar diagnostic archives
        org.opencontainers.image.licenses=PostgreSQL
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
