version: 2
# Every ecosystem's updates arrive grouped: one pull request per
# ecosystem for version updates, and one for security updates,
# instead of one per dependency.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web:
        patterns: ["*"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the native compiler, and it does not expose
      # the programmatic API that `astro check` and typescript-eslint
      # are built on: both refuse to load under it, so `npm run check`
      # and `npm run lint` stop working. The 6.x line still provides
      # that API and both tools accept it, so only 7 and later are
      # held back rather than every major.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
