version: 2
# Dependabot opens pull requests for security advisories only: one
# pull request per ecosystem, grouping every security update it needs.
# A limit of 0 keeps version updates from opening any, and security
# updates do not count against it. Docker has no entry, because
# Dependabot raises no security updates for Docker images.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the native compiler, and it does not expose
      # the programmatic API that `astro check` and typescript-eslint
      # are built on: both refuse to load under it, so `npm run check`
      # and `npm run lint` stop working. The 6.x line still provides
      # that API and both tools accept it, so only 7 and later are
      # held back rather than every major.
      - dependency-name: "typescript"
        versions: [">=7"]
