[project]
name = "radar-analyst"
version = "0.1.0"
description = "Internal service that analyzes radar diagnostic zipfiles with deterministic rules plus per-category LLM synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENCE" }
authors = [{ name = "Jimmy Angelakos", email = "jimmy.angelakos@pgedge.com" }]
# AI SDKs are required runtime dependencies: the briefing step is
# the core value proposition.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.19",
    "anthropic>=0.39",
    "google-genai>=0.3",
    "ollama>=0.4",
    "openai>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "flake8>=7.1",
    "mypy>=1.13",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "build>=1.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_analyst"]
exclude = ["src/radar_analyst/webdist"]

# Bundle the built Astro GUI into the wheel so `pip install .` ships
# a self-contained service. The custom build hook syncs ``web/dist``
# into ``src/radar_analyst/webdist`` and force-includes it from there.
# The include is registered by the hook rather than declared here so
# that a tree with no ``web/dist`` still builds, API-only.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/radar_analyst/tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that require Docker Compose + PostgreSQL",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["radar_analyst"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true
